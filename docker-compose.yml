# 9527 法规问答 · docker-compose（Gitee 原生部署，推荐）
# 用法：
#   git clone <你的 Gitee 仓库> pharma-kb-render && cd pharma-kb-render
#   # 方式一：构建时下载（在 .env 填入 KB_SQLITE_URL）
#   docker compose up -d --build
#   # 方式二：先用宿主机下载好 kb.sqlite，再挂载卷（更快、可复用）
#   #   把 kb.sqlite 放到 ./00_索引/kb.sqlite，再：docker compose up -d
services:
  pharma-kb:
    build:
      context: .
      args:
        KB_SQLITE_URL: ${KB_SQLITE_URL:-}
    image: pharma-kb:latest
    container_name: pharma-kb
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PORT=8000
      - KB_SQLITE_URL=${KB_SQLITE_URL:-}
    # 若宿主机已准备好 kb.sqlite，挂载该卷可跳过下载（注释掉 build 的 KB_SQLITE_URL 即可）
    volumes:
      - ./00_索引:/app/00_索引
    restart: unless-stopped
