<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>药品研发QA合规管理台（研发质量管理体系 · GMP指南2023版）</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <meta name="description" content="药品研发QA合规管理台：文件审阅（合规性/文件间冲突）、记录与申报资料核查（一致性/合规性）、变更管理、偏差与CAPA。检查表条目对应现行法规条款，数据存于本机。">
  <meta name="theme-color" content="#1f5fb0">
  <link rel="canonical" href="https://pharma-qa-9527.onrender.com/qa-workbench.html">
  <!-- Open Graph -->
  <meta property="og:title" content="药品研发QA合规管理台">
  <meta property="og:description" content="文件审阅、申报资料核查、变更管理、偏差与CAPA">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://pharma-qa-9527.onrender.com/qa-workbench.html">
<style>
  :root{
    --bg:#f4f6fb; --panel:#ffffff; --ink:#1f2a44; --muted:#6b7691;
    --line:#e3e8f2; --brand:#1f5fb0; --brand2:#2d7dd2; --soft:#eef4fc;
    --warn:#d9822b; --danger:#c0392b; --ok:#2e8b57; --chip:#e8f0fb;
    --shadow:0 1px 3px rgba(31,42,68,.08),0 6px 18px rgba(31,42,68,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
  /* layout */
  .app{display:flex;min-height:100vh}
  .sidebar{width:248px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;flex-shrink:0}
  .brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
  .brand h1{font-size:16px;margin:0;color:var(--brand);letter-spacing:.5px}
  .brand p{margin:4px 0 0;font-size:11px;color:var(--muted)}
  .nav{padding:8px 0}
  .nav-group{font-size:11px;color:var(--muted);font-weight:700;padding:12px 20px 4px;letter-spacing:1px}
  .nav-item{display:flex;align-items:center;gap:8px;padding:9px 20px;cursor:pointer;color:var(--ink);
    border-left:3px solid transparent;font-size:13px;user-select:none}
  .nav-item:hover{background:var(--soft)}
  .nav-item.active{background:var(--soft);border-left-color:var(--brand);color:var(--brand);font-weight:600}
  .nav-item .ic{font-size:15px;width:18px;text-align:center}
  .nav-item .cnt{margin-left:auto;font-size:11px;background:var(--chip);color:var(--brand);border-radius:10px;padding:1px 7px}
  .nav-item .cnt.alert{background:#fde8e4;color:var(--danger)}
  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .topbar h2{margin:0;font-size:18px}
  .topbar .sub{font-size:12px;color:var(--muted)}
  .spacer{flex:1}
  .topbar input,.topbar select{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;color:var(--ink)}
  .content{padding:22px 24px;flex:1}
  /* buttons */
  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer;font-size:13px;transition:.15s}
  .btn:hover{border-color:var(--brand2);color:var(--brand)}
  .btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn-primary:hover{background:var(--brand2);color:#fff}
  .btn-danger{color:var(--danger);border-color:#f0c9c2}
  .btn-danger:hover{background:#fde8e4;color:var(--danger)}
  .btn-sm{padding:4px 9px;font-size:12px}
  /* cards */
  .grid{display:grid;gap:16px}
  .cards{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .stat .k{font-size:12px;color:var(--muted)}
  .stat .v{font-size:26px;font-weight:700;margin-top:4px}
  .stat .v.warn{color:var(--warn)} .stat .v.danger{color:var(--danger)} .stat .v.ok{color:var(--ok)}
  .section{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-top:18px}
  .section h3{margin:0 0 14px;font-size:15px;display:flex;align-items:center;gap:8px}
  .section h3 .badge{font-size:11px;font-weight:600;color:var(--muted);background:var(--soft);padding:2px 9px;border-radius:8px}
  /* module grid on home */
  .mod-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;box-shadow:var(--shadow);transition:.15s;position:relative}
  .mod-card:hover{transform:translateY(-2px);border-color:var(--brand2)}
  .mod-card .mic{font-size:24px}
  .mod-card .mname{font-weight:600;margin-top:8px}
  .mod-card .mstat{font-size:12px;color:var(--muted);margin-top:4px}
  .mod-card .mopen{position:absolute;top:14px;right:14px;font-size:11px;border-radius:9px;padding:1px 8px;background:var(--chip);color:var(--brand)}
  .mod-card .mopen.alert{background:#fde8e4;color:var(--danger)}
  /* table */
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--soft);color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
  tbody tr:hover{background:#fafcff}
  td .tag{display:inline-block;font-size:11px;padding:1px 8px;border-radius:8px;background:var(--chip);color:var(--brand);margin:1px 2px}
  td .tag.r{background:#fde8e4;color:var(--danger)} td .tag.o{background:#fdf0e3;color:var(--warn)}
  td .tag.g{background:#e7f5ec;color:var(--ok)}
  .link{color:var(--brand);cursor:pointer;text-decoration:underline}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  /* today list */
  .today-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  .today-item.alert{border-color:#f0c9c2;background:#fff8f6}
  .today-item .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex-shrink:0}
  .today-item.alert .dot{background:var(--danger)}
  .today-item .tc{flex:1;min-width:0}
  .today-item .tt{font-weight:600}
  .today-item .tm{font-size:12px;color:var(--muted)}
  /* modal */
  .mask{position:fixed;inset:0;background:rgba(20,28,46,.45);display:none;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;padding:40px 16px}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:720px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);margin-bottom:40px}
  .modal-head{padding:16px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .modal-head h3{margin:0;font-size:16px}
  .modal-head .x{margin-left:auto;cursor:pointer;color:var(--muted);font-size:22px;line-height:1}
  .modal-body{padding:18px 22px;max-height:64vh;overflow-y:auto}
  .modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.full{grid-column:1/3}
  .field label{font-size:12px;color:var(--muted);font-weight:600}
  .field label .req{color:var(--danger);margin-left:2px}
  .field input,.field select,.field textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;color:var(--ink);background:#fff}
  .field textarea{resize:vertical;min-height:64px}
  .checks{display:flex;flex-wrap:wrap;gap:6px 14px;padding-top:2px}
  .checks label{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--ink);font-weight:400;cursor:pointer}
  .detail dl{display:grid;grid-template-columns:140px 1fr;gap:8px 14px;margin:0}
  .detail dt{color:var(--muted);font-size:12px;font-weight:600}
  .detail dd{margin:0;font-size:13px;word-break:break-word}
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;z-index:99;pointer-events:none}
  .toast.show{opacity:.95}
  /* cloud sync badge */
  .cloud-badge{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:6px 13px;cursor:pointer;background:var(--soft);color:var(--muted);user-select:none;display:inline-flex;align-items:center;white-space:nowrap}
  .cloud-badge:hover{border-color:var(--brand2)}
  .cloud-badge.on{background:#e7f5ec;color:var(--ok);border-color:#bfe3cd}
  .cloud-badge .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--muted);margin-right:5px}
  .cloud-badge.on .dot{background:var(--ok)}
  .cloud-badge .sync{font-size:10px;margin-left:6px;opacity:.8}
  .cloud-badge .sub{font-size:11px}
  @media(max-width:760px){.sidebar{display:none}.form-grid{grid-template-columns:1fr}.field.full{grid-column:1}.content{padding:14px}}
  /* file picker */
  .file-pick-bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .file-txt{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;flex:1;min-width:150px}
  .file-list{display:flex;flex-direction:column;gap:5px;max-height:200px;overflow:auto;border:1px dashed var(--line);border-radius:8px;padding:8px;background:#fafcff}
  .file-empty{color:var(--muted);font-size:12px;padding:6px 2px}
  .file-row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 8px}
  .fb{display:inline-block;font-size:10px;border-radius:6px;padding:1px 6px;color:#fff}
  .fb.kb{background:#2d7dd2}.fb.lo{background:#2e8b57}.fb.tx{background:#888}
  .fn{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fm{font-size:11px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kb-panel{margin-top:8px;border:1px solid var(--line);border-radius:8px;padding:8px;background:#fafcff}
  .kb-input{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;width:100%}
  .kb-res{margin-top:8px;max-height:220px;overflow:auto}
  .kb-row{background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:6px;cursor:pointer}
  .kb-row:hover{border-color:var(--brand2);background:var(--soft)}
  .kb-t{font-size:13px;font-weight:600}.kb-m{font-size:11px;color:var(--muted);margin-top:2px}
  /* AI verify */
  .ai-verify{display:flex;flex-direction:column;gap:8px}
  .ai-row{font-size:13px}.ai-lab{font-size:12px;color:var(--muted);font-weight:600}
  .ai-prompt{border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:13px;font-family:inherit;min-height:160px;resize:vertical}
  .ai-result{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:12px;background:#fafcff}
  .ai-out{white-space:normal;font-size:13px;line-height:1.6}
  .ai-warn{color:var(--warn);font-size:13px;line-height:1.6}
  .ai-sec{margin-bottom:10px}
  .ai-k{font-weight:700;color:var(--brand);font-size:13px;margin-bottom:3px}
  .ai-v{color:var(--ink)}
  .ai-ul{margin:4px 0 4px 18px;padding:0}
  .ai-ul li{margin-bottom:4px}
  /* 首次使用 / 无数据引导 */
  .empty-guide{background:var(--panel);border:1px dashed var(--brand2);border-radius:12px;padding:22px 24px;text-align:center;box-shadow:var(--shadow)}
  .eg-ic{font-size:34px;line-height:1}
  .eg-t{font-size:16px;font-weight:600;color:var(--brand);margin:8px 0 6px}
  .eg-d{font-size:13px;color:var(--muted);max-width:660px;margin:0 auto 14px;line-height:1.7}
  .eg-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .eg-tip{margin-top:12px;font-size:12px;color:var(--warn)}
</style>
<meta name="qa-api-base" content="same-origin">
<link rel="stylesheet" href="css/qa9.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <h1>💊 研发QA合规管理台</h1>
      <p>研发质量管理体系 · 对标《药品GMP指南（2023版）》第七章</p>
    </div>
    <div class="nav" id="nav"></div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>
        <h2 id="pageTitle">工作台首页</h2>
        <div class="sub" id="pageSub">研发全生命周期质量管理系统</div>
      </div>
      <div class="spacer"></div>
      <span id="cloudBadge" class="cloud-badge" onclick="openCloudModal()"><span class="dot"></span>☁ 本地模式（点此连接云端）</span>
      <button class="btn" onclick="exportAll()">⬇ 导出备份</button>
      <button class="btn" onclick="importAll()">⬆ 导入恢复</button>
      <button class="btn btn-danger" onclick="clearAll()">🗑 清空数据</button>
      <button class="btn" onclick="loadSamples()">✨ 载入示例</button>
    </div>
    <div class="content" id="content"></div>
  </main>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <div class="modal-head"><h3 id="modalTitle"></h3><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<input type="file" id="fileInput" accept=".json" style="display:none" onchange="doImport(event)">
<div class="toast" id="toast"></div>

<script src="js/qa-workbench.js" defer></script>
<script src="js/qa9-chat.js"></script>

  <p class="site-footer-text">本库数据来源于官方公开文件，仅供学习参考，不构成注册或合规意见。用药/申报请以官方原文为准。</p>
  <p class="site-footer-meta"><a href="/">← 返回首页</a> · <a href="/sitemap.xml">站点地图</a></p>
</div>
</body>
</html>
