# Render 一键部署（GitHub 仓库 tangwave/cde20，分支 master）
#
# 使用步骤：
#   1. 代码已推送到 GitHub（含法规库分卷 kb.sqlite.gz.00~.03，约 138MB）。
#   2. Render 控制台 → New → Blueprint → 选 GitHub 仓库 tangwave/cde20，
#      自动按本文件创建 Web Service（分支固定为 master）。
#   3. 创建表单里只需填一个必填项：LLM_API_KEY（你的 DeepSeek key）。
#      KB_SQLITE_URL 可留空——构建时 download_kb.sh 会自动合并分卷还原 kb.sqlite。
#   4. 部署完成后拿到 https://pharma-qa-9527.onrender.com，
#      前端 index.html 已设 meta[qa-api-base]="/"（同域实时），无需再改。
#
# 默认问答模式：QA_DEFAULT_MODE=local（用共享法规库做 RAG 问答，最稳）。
#   想试 DeepSeek 原生联网检索，可在环境变量改成 web，或在网页 UI 里直接切换模式。
#
# 注意：免费实例会休眠，首次访问需冷启动数秒；如需稳定可升级 Starter/Standard。
services:
  - type: web
    name: pharma-qa-9527
    runtime: python
    plan: free
    region: oregon
    branch: master
    # 先准备 kb.sqlite（缺失则报错并提示），再装 Python 依赖
    buildCommand: bash scripts/download_kb.sh && pip install -r api/requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        sync: false
      # 关键：kb.sqlite 的公网下载地址（渲染时拉取）。
      # 例如 GitHub Release 资源 / 对象存储签名 URL / 自有服务器直链。
      - key: KB_SQLITE_URL
        sync: false
      # 大模型：内置多个 OpenAI 兼容服务商（前端「⚙️ AI 模型」可切换）：
      #   · OpenRouter 真·免费模型（无需付费 Key，默认 nvidia/nemotron-3-ultra-550b-a55b:free）
      #   · DeepSeek（R1 推理，自备 Key）/ 智谱 GLM（GLM-5.1 编码，自备 Key）
      # 默认走 OpenRouter 免费模型；想换服务商，在 Render 控制台覆盖 LLM_PROVIDER/LLM_BASE_URL/
      # LLM_MODEL/LLM_API_KEY 即可，无需改本文件。
      # 注意：OpenRouter 为通用 chat 代理，provider 设为 openai（非 deepseek），避免误走 DeepSeek /responses 原生联网路径。
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      # 安全：密钥只放 Render 控制台环境变量（sync:false 不进仓库）。
      # 切勿把真实 key 提交到 Gitee/GitHub。
      - key: LLM_API_KEY
        sync: false
      # 默认问答模式：local=共享法规库 RAG（最稳）；web=内置联网检索（DuckDuckGo 等，可出引用）
      # 也可在网页 UI 里随时切换，此项仅决定初始默认
      - key: QA_DEFAULT_MODE
        value: local
      # === 用户登录模块（全站鉴权）===
      #
      # 两套账号存储方式，二选一。下方各项均为 sync:false（敏感，不进仓库），
      # 需要你在 Render 控制台 → Environment 手动添加。
      #
      # 【A. 环境变量模式（推荐）】无需外部数据库，零成本、无冷启动。
      #   账号编码进 AUTH_USERS_JSON，会话改用 HMAC 签名 cookie——两者都跨部署保持，
      #   因此重新部署既不会丢账号，也不会把已登录的人踢下线。
      #   生成方式（在本机仓库根目录执行，会打印出待填的值）：
      #     python scripts/create_user.py env-init            # 首个管理员
      #     python scripts/create_user.py env-add <用户名> <口令> [--role admin]
      #   ⚠ AUTH_SECRET 一旦生成就不要再改，重新生成会让所有已登录用户立即掉线。
      - key: AUTH_USERS_JSON
        sync: false
      - key: AUTH_SECRET
        sync: false
      #
      # 【B. 数据库模式】账号存 PostgreSQL，改账号即时生效（不用重新部署），
      #   审计日志永久保留。填了 DATABASE_URL 就自动切到本模式（优先级高于 A）。
      #   适合账号较多或需要留存完整审计轨迹的场景。
      #   注意：Neon 免费层 5 分钟无访问即挂起，低频访问站点慎用。
      - key: DATABASE_URL
        sync: false
      #
      # 会话有效期（小时）
      - key: SESSION_TTL_HOURS
        value: "72"
      # 【启用开关】留空 = 自动推断：只有配了 AUTH_USERS_JSON 或 DATABASE_URL 才开启。
      #   这样在还没配置任何账号时站点保持公开，不会把所有人挡在登录页外。
      #   显式置 "0" 可临时全站免登录（排障用）；置 "1" 则强制开启（请确认已有账号）。
      - key: AUTH_ENABLED
        sync: false
      # 【应急吊销】填一个 Unix 时间戳，早于该时刻签发的所有会话立即作废。
      #   用于 AUTH_SECRET 疑似泄露时强制全员重新登录。平时留空。
      - key: AUTH_REVOKE_BEFORE
        sync: false
      # === 切换 DeepSeek（取消注释下方 4 行，并注释上方 LLM_* 4 行）===
      # - key: LLM_PROVIDER
      #   value: deepseek
      # - key: LLM_BASE_URL
      #   value: https://api.deepseek.com/v1
      # - key: LLM_MODEL
      #   value: deepseek-v3-lite
      # - key: LLM_API_KEY
      #   sync: false
      # === 切换智谱 GLM（取消注释下方 4 行，并注释上方 LLM_* 4 行）===
      # - key: LLM_PROVIDER
      #   value: zhipu
      # - key: LLM_BASE_URL
      #   value: https://open.bigmodel.cn/api/paas/v4
      # - key: LLM_MODEL
      #   value: glm-5.1
      # - key: LLM_API_KEY
      #   sync: false
      # 可选：KB_QUERY_PY 指向虚拟环境 python；不填则默认用运行 server.py 的解释器
      # - key: KB_QUERY_PY
      #   value: /opt/render/project/venv/bin/python
