# Render 一键部署（经 GitHub 镜像；Render 原生不支持 Gitee）
#
# 使用步骤：
#   1. 本仓库主仓在 Gitee；Render 只支持 GitHub/GitLab/Bitbucket。
#      先用仓库内 scripts/sync_to_github.sh 把代码镜像到 GitHub（见 README 方式二）。
#      （kb.sqlite 约 212MB，超过 GitHub 100MB 单文件限制，
#       请勿直接提交；用「构建时下载」KB_SQLITE_URL，见 README）。
#   2. 在 Render 控制台 → New → Blueprint → 选该 GitHub 仓库，
#      自动按本文件创建 Web Service。
#   3. 在 Render 环境变量里设置 KB_SQLITE_URL（指向 kb.sqlite 的可下载地址）。
#   4. 部署完成后拿到 https://pharma-qa-9527.onrender.com，
#      前端 index.html 已设 meta[qa-api-base]="/"（同域实时），无需再改。
#
# 注意：免费实例会休眠，首次访问需冷启动数秒；如需稳定可升级 Starter/Standard。
services:
  - type: web
    name: pharma-qa-9527
    runtime: python
    plan: free
    region: oregon
    branch: main
    # 先准备 kb.sqlite（缺失则报错并提示），再装 Python 依赖
    buildCommand: bash scripts/download_kb.sh && pip install -r api/requirements.txt
    startCommand: uvicorn api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PORT
        sync: false
      # 关键：kb.sqlite 的公网下载地址（渲染时拉取）。
      # 例如 GitHub Release 资源 / 对象存储签名 URL / 自有服务器直链。
      - key: KB_SQLITE_URL
        sync: false
      # 海云AI 大模型：当前用智谱 GLM-4-Flash（DeepSeek key 余额不足 402，待充值后切换）
      - key: LLM_PROVIDER
        value: zhipu
      - key: LLM_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4/
      - key: LLM_MODEL
        value: glm-4-flash
      - key: LLM_API_KEY
        sync: false
        value: 5d8c736720d74887ac5dc0e9eeeda1a8.QCO4oPW395uWfKjj
      # === DeepSeek（账户充值后启用：把上面 4 行 LLM_* 替换为下面 4 行）===
      # - key: LLM_PROVIDER
      #   value: deepseek
      # - key: LLM_BASE_URL
      #   value: https://api.deepseek.com/v1
      # - key: LLM_MODEL
      #   value: deepseek-chat
      # - key: LLM_API_KEY
      #   sync: false
      #   value: sk-93fe6d3739c94d32983498ecd641a0c6
      # 可选：KB_QUERY_PY 指向虚拟环境 python；不填则默认用运行 server.py 的解释器
      # - key: KB_QUERY_PY
      #   value: /opt/render/project/venv/bin/python
