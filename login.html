<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light"/>
<meta name="robots" content="noindex, nofollow"/>
<title>登录 · 海云AI 药品研发生产 QA 专家</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--bd:#dde5f0;--tx:#1f2a37;--mut:#6b7280;
      --acc:#0e8a6e;--acc2:#0b6e5a;--err:#c0392b;}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
     font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
     background:linear-gradient(160deg,#0a6e5e 0%,#0e9f6e 45%,#f4f7fb 45%,#f4f7fb 100%);
     color:var(--tx);padding:20px}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);
     border-radius:16px;box-shadow:0 18px 46px rgba(15,40,60,.18);padding:34px 30px 28px}
.brand{text-align:center;margin-bottom:22px}
.brand .ic{font-size:34px;line-height:1}
.brand h1{margin:8px 0 4px;font-size:19px;color:var(--acc2)}
.brand p{margin:0;font-size:12.5px;color:var(--mut)}
label{display:block;font-size:12.5px;font-weight:600;color:#41506a;margin:14px 0 6px}
input{width:100%;height:42px;padding:0 12px;font-size:14px;color:var(--tx);
      border:1px solid var(--bd);border-radius:9px;background:#fbfdff;outline:none}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(14,138,110,.12)}
button{width:100%;height:44px;margin-top:20px;border:0;border-radius:9px;cursor:pointer;
       background:linear-gradient(120deg,#0a6e5e,#0e9f6e);color:#fff;
       font-size:14.5px;font-weight:700;letter-spacing:.5px}
button:hover{filter:brightness(1.06)}
button:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;padding:9px 12px;border-radius:8px;font-size:12.5px;display:none}
.msg.err{display:block;background:#fdecea;color:var(--err);border:1px solid #f5c6c0}
.msg.ok{display:block;background:#e8f6f1;color:var(--acc2);border:1px solid #bfe5d8}
.tip{margin-top:18px;padding-top:14px;border-top:1px dashed var(--bd);
     font-size:11.5px;color:var(--mut);line-height:1.7}
code{background:#eef2f7;padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
<div class="box">
  <div class="brand">
    <div class="ic">💊</div>
    <h1>海云AI · 药品研发生产 QA 专家</h1>
    <p>法规与注册申报顾问 · 请登录以继续</p>
  </div>

  <form id="f" autocomplete="on">
    <label for="u">用户名</label>
    <input id="u" name="username" type="text" autocomplete="username"
           placeholder="请输入用户名" required autofocus/>

    <label for="p">口令</label>
    <input id="p" name="password" type="password" autocomplete="current-password"
           placeholder="请输入口令" required/>

    <button id="btn" type="submit">登 录</button>
  </form>

  <div id="msg" class="msg"></div>

  <div class="tip">
    · 账号由管理员开通，不开放自助注册。<br/>
    · 连续多次输错会被记录到审计日志（含 IP）。<br/>
    · 会话有效期 72 小时，登出后立即失效。
  </div>
</div>

<script>
(function(){
  var f=document.getElementById('f'), btn=document.getElementById('btn'),
      msg=document.getElementById('msg'), u=document.getElementById('u'),
      p=document.getElementById('p');
  function show(t,cls){ msg.className='msg '+cls; msg.textContent=t; }
  function nextUrl(){
    var m=/[?&]next=([^&]+)/.exec(location.search);
    var n=m?decodeURIComponent(m[1]):'';
    // 仅允许站内相对路径，防止开放重定向
    if(!n || n.indexOf('//')===0 || /^[a-z]+:/i.test(n)) n='/';
    return n;
  }
  f.addEventListener('submit', async function(e){
    e.preventDefault();
    if(!u.value.trim() || !p.value){ show('请填写用户名与口令','err'); return; }
    btn.disabled=true; btn.textContent='登录中…'; show('','');
    try{
      var r=await fetch('/api/auth/login',{
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({username:u.value.trim(), password:p.value})
      });
      var d={}; try{ d=await r.json(); }catch(_){}
      if(r.ok && d.ok){
        show('登录成功，正在跳转…','ok');
        setTimeout(function(){ location.href=nextUrl(); }, 350);
      }else{
        show(d.error || ('登录失败（HTTP '+r.status+'）'),'err');
        btn.disabled=false; btn.textContent='登 录'; p.value=''; p.focus();
      }
    }catch(err){
      show('网络异常，请稍后重试','err');
      btn.disabled=false; btn.textContent='登 录';
    }
  });
})();
</script>
</body>
</html>
